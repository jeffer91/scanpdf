name: Windows · instalador
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar el motor OCR y PDF
        run: python -m pip install -r backend/requirements.txt
      - name: Ejecutar pruebas automatizadas
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Descargar modelos OCR en etapa de compilación
        run: rapidocr download_models
      - name: Empaquetar el motor Python
        run: >-
          pyinstaller --noconfirm --clean --onefile
          --name scanpdf-engine
          --distpath dist-engine
          --collect-all rapidocr
          --collect-all onnxruntime
          --collect-all pymupdf
          --collect-all fitz
          --collect-all pyhanko
          --collect-all pyhanko_certvalidator
          backend/engine.py
      - name: Probar el motor empaquetado
        run: python tests/smoke_windows.py dist-engine/scanpdf-engine.exe
      - name: Instalar Electron
        run: npm install --no-audit --no-fund
      - name: Crear instalador de Windows
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publicar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ScanPDF-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
